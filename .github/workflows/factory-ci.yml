name: Factory CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  factory-ci:
    name: factory-ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify factory gate marker
        run: test -s FACTORY_GATE.md
